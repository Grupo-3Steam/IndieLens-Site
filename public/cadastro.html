<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
   <div class="container">

        <div class="card-cadastro">

            <div class="titulo">
                <h1>CADASTRE-SE</h1>
            </div>

            <div class="formulario">

                <div class="campo">
                    <input id="nome_input" type="text" placeholder="Nome completo">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="campo">
                    <input id="email_input" type="text" placeholder="Email">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="campo">
                    <input id="senha_input" type="password" placeholder="Senha">
                    <i class="fa-solid fa-circle-info"></i>
                </div>

                <div class="campo">
                    <input id="confirmacao_senha_input" type="password" placeholder="Confirmar Senha">
                    <i class="fa-solid fa-circle-info"></i>
                </div>

                <button class="botao" onclick="cadastrar()">CADASTRAR</button>

            </div>

        </div>

        <div class="imagem">

            <img src="celeste-e1534205369647.jpg" alt="Imagem">

        </div>

    </div>
</body>
</html>
